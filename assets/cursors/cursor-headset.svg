<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
        <defs>
                <linearGradient id="headsetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:currentColor;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.85" />
                </linearGradient>
        </defs>

  <!-- KULAKLIK (HEADSET) - CALL CENTER TEMA -->
  
  <!-- Baş Bandı (Headband Arc) -->
  <path d="M 9 8 Q 9 4 16 4 Q 23 4 23 8" 
          stroke="url(#headsetGradient)" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round"/>
  
  <!-- Sol Kulaklık Bardağı (Left Ear Cup) -->
  <circle cx="9" cy="14" r="5" 
          fill="none" 
          stroke="url(#headsetGradient)" 
          stroke-width="2"/>
  <circle cx="9" cy="14" r="3" 
          fill="currentColor" 
          opacity="0.9"/>
  
  <!-- Sağ Kulaklık Bardağı (Right Ear Cup) -->
  <circle cx="23" cy="14" r="5" 
          fill="none" 
          stroke="url(#headsetGradient)" 
          stroke-width="2"/>
  <circle cx="23" cy="14" r="3" 
          fill="currentColor" 
          opacity="0.9"/>
  
  <!-- Mikrofon Boom (Sol taraftan) -->
  <path d="M 9 18 Q 7 20 6 24" 
          stroke="url(#headsetGradient)" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round"/>
  
  <!-- Mikrofon Baş (Microphone Head) -->
  <circle cx="6" cy="26" r="2" 
          fill="currentColor"/>
  
  <!-- Aktivite Göstergesi (Activity Dots) -->
  <circle cx="16" cy="27" r="1.5" 
          fill="currentColor" 
          opacity="0.95"/>
  <circle cx="20" cy="27" r="1" 
          fill="currentColor" 
          opacity="0.7"/>
  
  <!-- İŞARETÇİ OK (POINTER ARROW) - Görünürlük için -->
        <polygon points="2,2 2,12 8,8" 
                                         fill="currentColor"/>
        <polygon points="2,2 2,12 8,8" 
                                         fill="currentColor" 
                                         opacity="0.25"/>
</svg>